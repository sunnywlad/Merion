name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx hardhat test --coverage --gas-stats --gas-stats-json gas-stats.json
      # Controle de non-regression du cout en gaz. Uniquement sur les PR :
      # l'egalite est stricte, l'imposer a chaque push forcerait a rafraichir
      # la reference en cours de developpement. Le profil doit etre le meme
      # qu'a la generation, sinon les chiffres ne veulent rien dire (voir
      # backend/GAS.md).
      - name: Controle de non-regression du gaz
        if: github.event_name == 'pull_request'
        run: npx hardhat test solidity contracts/Pool.gas.t.sol --snapshot-check --build-profile production
      - name: Publier le rapport de gaz dans le resume du run
        if: always()
        run: |
          if [ -f gas-stats.json ]; then
            {
              echo "## Rapport de gaz"
              echo
              jq -r '
                .contracts
                | to_entries[]
                | select((.value.functions // {}) != {})
                | "### \(.key)\n\n| Fonction | Min | Moyenne | Mediane | Max | Appels |\n|---|---|---|---|---|---|\n"
                  + ((.value.functions | to_entries
                      | map("| \(.key) | \(.value.min) | \(.value.avg) | \(.value.median) | \(.value.max) | \(.value.count) |")
                      | join("\n")))
              ' gas-stats.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # `next build` AVANT `tsc` : Next 16 genere des types dans .next/types
      # (LayoutProps, PageProps...) auxquels le code source se refere. En local
      # ils existent deja grace a `next dev` ; sur un runner vierge, un `tsc`
      # lance en premier echoue sur des types qui n'ont pas encore ete ecrits.
      # NEXT_PUBLIC_PROJECT_ID est lu au niveau module par src/config/index.ts,
      # et `next build` prerend `/` : sans cette valeur, la construction echoue.
      # Variable de depot et non secret : un NEXT_PUBLIC_* part dans le bundle
      # navigateur, il est public par construction. Voir frontend/.env.example.
      - run: npm run build
        env:
          NEXT_PUBLIC_PROJECT_ID: ${{ vars.NEXT_PUBLIC_PROJECT_ID }}
      - run: npx tsc --noEmit
