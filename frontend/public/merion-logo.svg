<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Merion">
  <title>Merion</title>
  <!-- Hexagon: sharp vertices + stroke-linejoin="round" rounds the OUTER edge of the stroke, the INNER edge stays sharp. -->
  <path
    d="M 30 10 L 70 10 L 95 50 L 70 90 L 30 90 L 5 50 Z"
    stroke="#311ca7"
    stroke-width="3"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- M: two triangles meeting at the center (the valley) -->
  <path d="M 22 25 L 50 55 L 22 75 Z" fill="#311ca7" />
  <path d="M 78 25 L 50 55 L 78 75 Z" fill="#311ca7" />
  <!-- Double-bar legs: extended to meet the hexagon at top and bottom -->
  <line x1="19" y1="27.6" x2="19" y2="72.4" stroke="#311ca7" stroke-width="3" stroke-linecap="butt" />
  <line x1="81" y1="27.6" x2="81" y2="72.4" stroke="#311ca7" stroke-width="3" stroke-linecap="butt" />
</svg>
